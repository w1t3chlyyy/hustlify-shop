<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" fill="none">
  <defs>
    <radialGradient id="rim" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#46515d"/>
      <stop offset=".28" stop-color="#111923"/>
      <stop offset=".72" stop-color="#02060a"/>
      <stop offset="1" stop-color="#202a35"/>
    </radialGradient>
    <linearGradient id="rimEdge" x1="53" y1="49" x2="382" y2="385" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9c5d0" stop-opacity=".8"/>
      <stop offset=".22" stop-color="#222d37"/>
      <stop offset=".52" stop-color="#05090d"/>
      <stop offset=".8" stop-color="#66727e" stop-opacity=".75"/>
      <stop offset="1" stop-color="#080d12"/>
    </linearGradient>
    <radialGradient id="blue" cx="36%" cy="24%" r="82%">
      <stop stop-color="#56a4ff"/>
      <stop offset=".55" stop-color="#2674e9"/>
      <stop offset="1" stop-color="#1455c5"/>
    </radialGradient>
    <radialGradient id="white" cx="36%" cy="27%" r="84%">
      <stop stop-color="#fff"/>
      <stop offset=".68" stop-color="#eff4f9"/>
