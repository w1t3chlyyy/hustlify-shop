    <circle cx="216" cy="216" r="198" stroke="url(#rimEdge)" stroke-width="5"/>
    <circle cx="216" cy="216" r="190" fill="#080d13" stroke="#293541" stroke-width="3"/>
    <circle cx="216" cy="216" r="183" fill="#dfe8f2"/>

    <g clip-path="url(#faceClip)" stroke="#d9e3ee" stroke-width="3" stroke-linejoin="round">
      <path d="M216 216 L146.8 48.8 A181 181 0 0 1 285.2 48.8 Z" fill="url(#blue)"/>
      <path d="M216 216 L285.2 48.8 A181 181 0 0 1 383.2 146.8 Z" fill="url(#white)"/>
      <path d="M216 216 L383.2 146.8 A181 181 0 0 1 383.2 285.2 Z" fill="url(#blue)"/>
      <path d="M216 216 L383.2 285.2 A181 181 0 0 1 285.2 383.2 Z" fill="url(#white)"/>
      <path d="M216 216 L285.2 383.2 A181 181 0 0 1 146.8 383.2 Z" fill="url(#blue)"/>
      <path d="M216 216 L146.8 383.2 A181 181 0 0 1 48.8 285.2 Z" fill="url(#white)"/>
